name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Validate vendored spec
        run: uv run .kit/validate.py .spec

      - name: Format
        run: zig fmt --check build.zig build.zig.zon src tools examples

      - name: Unit tests
        run: zig build test

      - name: Conformance
        run: zig build conformance

      - name: Canonical examples
        run: zig build examples

      - name: Benchmark builds and matches the checksum (timings not recorded from CI)
        run: if [ -d .spec/bench ]; then zig build bench; else echo "spec bench input not vendored yet"; fi
